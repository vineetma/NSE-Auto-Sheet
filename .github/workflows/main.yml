name: Update NSE Stocks to Google Sheet
on:
  schedule:
    # It will run at 11:22 am IST
    - cron: '56 05 * * 1-5'
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Date to fetch bhavcopy for (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''
jobs:
  update-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install gspread oauth2client pandas requests

      - name: Run Python Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: python update_sheet.py
